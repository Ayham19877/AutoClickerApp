name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clean Workspace & Setup Project Files
      run: |
        rm -rf app settings.gradle build.gradle gradle.properties gradlew gradlew.bat gradle
        mkdir -p app/src/main/java/com/example/autoclicker
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/xml

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AutoClickerApp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.autoclicker'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.autoclicker"
                minSdk 24
                targetSdk 33
                versionCode 7
                versionName "7.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.VIBRATE" />

            <application
                android:allowBackup="true"
                android:label="Auto Clicker"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".AutoClickService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:fillViewport="true">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:padding="20dp"
                android:gravity="center_horizontal">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="تطبيق النقر التلقائي الفائق"
                    android:textSize="22sp"
                    android:textStyle="bold"/>

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="برمجة الأيهم"
                    android:textSize="14sp"
                    android:textColor="#3F51B5"
                    android:textStyle="bold"
                    android:layout_marginBottom="16dp"/>

                <!-- مفتاح التفعيل الرئيسي -->
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:gravity="center_vertical"
                    android:padding="12dp"
                    android:background="#E8EAF6"
                    android:layout_marginBottom="10dp">

                    <TextView
                        android:layout_width="0dp"
                        android:layout_height="wrap_content"
                        android:layout_weight="1"
                        android:text="تفعيل / إيقاف التلقائي:"
                        android:textSize="15sp"
                        android:textStyle="bold" />

                    <androidx.appcompat.widget.SwitchCompat
                        android:id="@+id/switchEnable"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"/>
                </LinearLayout>

                <!-- مفتاح التنبيه الصوتي -->
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:gravity="center_vertical"
                    android:padding="12dp"
                    android:background="#F5F5F5"
                    android:layout_marginBottom="10dp">

                    <TextView
                        android:layout_width="0dp"
                        android:layout_height="wrap_content"
                        android:layout_weight="1"
                        android:text="التنبيه الصوتي عند النقر:"
                        android:textSize="15sp" />

                    <androidx.appcompat.widget.SwitchCompat
                        android:id="@+id/switchSound"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"/>
                </LinearLayout>

                <!-- مفتاح الإشعارات -->
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:gravity="center_vertical"
                    android:padding="12dp"
                    android:background="#F5F5F5"
                    android:layout_marginBottom="16dp">

                    <TextView
                        android:layout_width="0dp"
                        android:layout_height="wrap_content"
                        android:layout_weight="1"
                        android:text="إرسال إشعار عند النقر:"
                        android:textSize="15sp" />

                    <androidx.appcompat.widget.SwitchCompat
                        android:id="@+id/switchNotification"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"/>
                </LinearLayout>

                <TextView
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="أدخل الكلمات وافصل بينها بفاصلة (، أو ,):"
                    android:textSize="14sp"
                    android:layout_marginBottom="8dp"/>

                <EditText
                    android:id="@+id/etWords"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="مثال: Accept, Confirm, Done"
                    android:inputType="textMultiLine"
                    android:minLines="2"
                    android:padding="12dp"
                    android:background="@android:drawable/editbox_background"
                    android:layout_marginBottom="16dp"/>

                <Button
                    android:id="@+id/btnSave"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="حفظ التغييرات"
                    android:layout_marginBottom="10dp"/>

                <Button
                    android:id="@+id/btnAccessibility"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="إعدادات إمكانية الوصول"
                    android:backgroundTint="#4CAF50"
                    android:layout_marginBottom="20dp"/>

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="حقوق الطبع والتطوير © برمجة الأيهم"
                    android:textSize="12sp"
                    android:textColor="#757575"/>

            </LinearLayout>
        </ScrollView>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeAllMask"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
            android:canRetrieveWindowContent="true"
            android:canPerformGestures="true"
            android:notificationTimeout="0" />
        EOF

        cat << 'EOF' > app/src/main/java/com/example/autoclicker/MainActivity.java
        package com.example.autoclicker;

        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.os.Bundle;
        import android.provider.Settings;
        import android.widget.Button;
        import android.widget.EditText;
        import android.widget.Toast;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.appcompat.widget.SwitchCompat;

        public class MainActivity extends AppCompatActivity {

            private EditText etWords;
            private SwitchCompat switchEnable, switchSound, switchNotification;
            private SharedPreferences prefs;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                etWords = findViewById(R.id.etWords);
                switchEnable = findViewById(R.id.switchEnable);
                switchSound = findViewById(R.id.switchSound);
                switchNotification = findViewById(R.id.switchNotification);

                Button btnSave = findViewById(R.id.btnSave);
                Button btnAccessibility = findViewById(R.id.btnAccessibility);

                prefs = getSharedPreferences("AutoClickerPrefs", MODE_PRIVATE);

                etWords.setText(prefs.getString("words_list", "Accept, Confirm, Done"));
                switchEnable.setChecked(prefs.getBoolean("is_enabled", true));
                switchSound.setChecked(prefs.getBoolean("sound_enabled", true));
                switchNotification.setChecked(prefs.getBoolean("notification_enabled", true));

                switchEnable.setOnCheckedChangeListener((btn, isChecked) -> prefs.edit().putBoolean("is_enabled", isChecked).apply());
                switchSound.setOnCheckedChangeListener((btn, isChecked) -> prefs.edit().putBoolean("sound_enabled", isChecked).apply());
                switchNotification.setOnCheckedChangeListener((btn, isChecked) -> prefs.edit().putBoolean("notification_enabled", isChecked).apply());

                btnSave.setOnClickListener(v -> {
                    String words = etWords.getText().toString().trim();
                    if (!words.isEmpty()) {
                        prefs.edit().putString("words_list", words).apply();
                        Toast.makeText(MainActivity.this, "تم حفظ الإعدادات بنجاح (برمجة الأيهم)", Toast.LENGTH_SHORT).show();
                    } else {
                        Toast.makeText(MainActivity.this, "الرجاء إدخال كلمة واحدة على الأقل", Toast.LENGTH_SHORT).show();
                    }
                });

                btnAccessibility.setOnClickListener(v -> {
                    Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                    startActivity(intent);
                });
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/autoclicker/AutoClickService.java
        package com.example.autoclicker;

        import android.accessibilityservice.AccessibilityService;
        import android.accessibilityservice.GestureDescription;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.content.Context;
        import android.content.SharedPreferences;
        import android.graphics.Path;
        import android.graphics.Rect;
        import android.media.Ringtone;
        import android.media.RingtoneManager;
        import android.net.Uri;
        import android.os.Build;
        import android.view.accessibility.AccessibilityEvent;
        import android.view.accessibility.AccessibilityNodeInfo;
        import androidx.core.app.NotificationCompat;
        import java.util.concurrent.ExecutorService;
        import java.util.concurrent.Executors;

        public class AutoClickService extends AccessibilityService {

            private int currentStep = 0;
            private static final String CHANNEL_ID = "AutoClickerChannel";
            private final ExecutorService executor = Executors.newSingleThreadExecutor();

            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
                SharedPreferences prefs = getSharedPreferences("AutoClickerPrefs", MODE_PRIVATE);

                if (!prefs.getBoolean("is_enabled", true)) return;

                String rawWords = prefs.getString("words_list", "");
                if (rawWords.isEmpty()) return;

                String[] words = rawWords.split("[,،]");
                if (words.length == 0) return;

                if (currentStep >= words.length) currentStep = 0;

                String targetWord = words[currentStep].trim();
                if (targetWord.isEmpty()) return;

                AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                if (rootNode == null) return;

                if (scanAndClick(rootNode, targetWord)) {
                    final boolean soundOn = prefs.getBoolean("sound_enabled", true);
                    final boolean notifOn = prefs.getBoolean("notification_enabled", true);
                    final String matchedWord = targetWord;

                    // تنفيذ التنبيهات في الخلفية دون تعطيل محرك النقر المباشر
                    executor.execute(() -> {
                        if (soundOn) playSound();
                        if (notifOn) sendNotification(matchedWord);
                    });

                    currentStep++;
                    if (currentStep >= words.length) currentStep = 0;

                    // فحص فوري وسريع للكلمة التالية في نفس التفاعل
                    AccessibilityNodeInfo nextRoot = getRootInActiveWindow();
                    if (nextRoot != null) {
                        String nextWord = words[currentStep].trim();
                        if (!nextWord.isEmpty() && scanAndClick(nextRoot, nextWord)) {
                            currentStep++;
                            if (currentStep >= words.length) currentStep = 0;
                        }
                        nextRoot.recycle();
                    }
                }
                rootNode.recycle();
            }

            private boolean scanAndClick(AccessibilityNodeInfo node, String targetText) {
                if (node == null) return false;

                CharSequence text = node.getText();
                CharSequence desc = node.getContentDescription();

                boolean matchText = text != null && text.toString().toLowerCase().contains(targetText.toLowerCase());
                boolean matchDesc = desc != null && desc.toString().toLowerCase().contains(targetText.toLowerCase());

                if (matchText || matchDesc) {
                    boolean clicked = node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                    Rect rect = new Rect();
                    node.getBoundsInScreen(rect);
                    clickAt(rect.centerX(), rect.centerY());
                    return true;
                }

                for (int i = 0; i < node.getChildCount(); i++) {
                    AccessibilityNodeInfo child = node.getChild(i);
                    if (child != null) {
                        boolean clicked = scanAndClick(child, targetText);
                        child.recycle();
                        if (clicked) return true;
                    }
                }
                return false;
            }

            private void clickAt(int x, int y) {
                Path path = new Path();
                path.moveTo(x, y);
                GestureDescription.Builder builder = new GestureDescription.Builder();
                GestureDescription gesture = builder.addStroke(new GestureDescription.StrokeDescription(path, 0, 1)).build();
                dispatchGesture(gesture, null, null);
            }

            private void playSound() {
                try {
                    Uri notification = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                    Ringtone r = RingtoneManager.getRingtone(getApplicationContext(), notification);
                    r.play();
                } catch (Exception e) {
                    e.printStackTrace();
                }
            }

            private void sendNotification(String word) {
                NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Auto Clicker Alerts", NotificationManager.IMPORTANCE_DEFAULT);
                    if (manager != null) manager.createNotificationChannel(channel);
                }

                NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setSmallIcon(android.R.drawable.stat_notify_chat)
                        .setContentTitle("برمجة الأيهم - تم النقر تلقائياً")
                        .setContentText("تم العثور والنقر على الكلمة: " + word)
                        .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                        .setAutoCancel(true);

                if (manager != null) {
                    manager.notify((int) System.currentTimeMillis(), builder.build());
                }
            }

            @Override
            public void onInterrupt() {}
        }
        EOF

    - name: Setup & Build with Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoClicker-APK
        path: app/build/outputs/apk/debug/*.apk





