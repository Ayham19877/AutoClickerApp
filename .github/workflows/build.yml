name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK & Build APK
      run: |
        mkdir -p build/src/com/example/autoclicker
        mkdir -p build/res/xml
        mkdir -p build/bin
        mkdir -p build/gen

        cat << 'EOF' > build/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canRetrieveWindowContent="true"
            android:notificationTimeout="10" />
        EOF

        cat << 'EOF' > build/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.autoclicker">
            <application
                android:label="Auto Clicker"
                android:supportsRtl="true">
                <service
                    android:name=".AutoClickService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > build/src/com/example/autoclicker/AutoClickService.java
        package com.example.autoclicker;

        import android.accessibilityservice.AccessibilityService;
        import android.view.accessibility.AccessibilityEvent;
        import android.view.accessibility.AccessibilityNodeInfo;
        import java.util.List;

        public class AutoClickService extends AccessibilityService {

            private static final String TARGET_TEXT = "Accept";

            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
                if (event == null) return;
                AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                if (rootNode == null) return;

                List<AccessibilityNodeInfo> nodes = rootNode.findAccessibilityNodeInfosByText(TARGET_TEXT);
                if (nodes != null && !nodes.isEmpty()) {
                    for (AccessibilityNodeInfo node : nodes) {
                        if (node.getText() != null && node.getText().toString().toLowerCase().contains(TARGET_TEXT.toLowerCase())) {
                            if (!clickNodeOrParent(node)) {
                                node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                            }
                            break;
                        }
                    }
                }
            }

            private boolean clickNodeOrParent(AccessibilityNodeInfo node) {
                AccessibilityNodeInfo current = node;
                while (current != null) {
                    if (current.isClickable()) {
                        return current.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                    }
                    current = current.getParent();
                }
                return false;
            }

            @Override
            public void onInterrupt() {}
        }
        EOF

        SDK_DIR=$ANDROID_HOME
        BUILD_TOOLS=$SDK_DIR/build-tools/33.0.2
        PLATFORM=$SDK_DIR/platforms/android-33/android.jar

        $BUILD_TOOLS/aapt package -f -m -J build/gen -S build/res -M build/AndroidManifest.xml -I $PLATFORM

        javac -d build/bin -classpath $PLATFORM -sourcepath build/src:build/gen build/src/com/example/autoclicker/AutoClickService.java build/gen/com/example/autoclicker/R.java

        $BUILD_TOOLS/d8 --output build/bin/ $BUILD_TOOLS/lib/dx.jar build/bin/com/example/autoclicker/*.class

        $BUILD_TOOLS/aapt package -f -M build/AndroidManifest.xml -S build/res -I $PLATFORM -F build/unsigned.apk build/bin

        cd build/bin
        zip -q -r ../unsigned.apk classes.dex
        cd ../..

        keytool -genkey -v -keystore build/key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass password -keypass password -dname "CN=AutoClicker"
        $BUILD_TOOLS/apksigner sign --ks build/key.jks --ks-pass pass:password --out build/AutoClicker-release.apk build/unsigned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoClicker-APK
        path: build/AutoClicker-release.apk

