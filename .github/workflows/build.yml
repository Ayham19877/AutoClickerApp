name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Pillow
      run: pip install Pillow

    - name: Clean Workspace & Setup Project Directories
      run: |
        rm -rf app settings.gradle build.gradle gradle.properties gradlew gradlew.bat gradle
        mkdir -p app/src/main/java/com/example/autoclicker
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-mdpi
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AutoClickerApp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.autoclicker'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.autoclicker"
                minSdk 24
                targetSdk 33
                versionCode 17
                versionName "17.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

    - name: Generate True Syrian Revolution Flag Icons & Assets
      run: |
        python3 -c '
        from PIL import Image, ImageDraw

        def create_syrian_flag_icon(size):
            img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
            draw = ImageDraw.Draw(img)
            h = size
            w = size
            draw.rectangle([0, 0, w, h // 3], fill=(0, 128, 0, 255))
            draw.rectangle([0, h // 3, w, (2 * h) // 3], fill=(255, 255, 255, 255))
            draw.rectangle([0, (2 * h) // 3, w, h], fill=(20, 20, 20, 255))
            
            def draw_star(cx, cy, r):
                import math
                points = []
                for i in range(10):
                    angle = i * math.pi / 5 - math.pi / 2
                    curr_r = r if i % 2 == 0 else r / 2
                    points.append((cx + curr_r * math.cos(angle), cy + curr_r * math.sin(angle)))
                draw.polygon(points, fill=(204, 0, 0, 255))

            y_center = h // 2
            star_r = max(2, int(size * 0.08))
            spacing = int(size * 0.22)
            
            draw_star(w // 2 - spacing, y_center, star_r)
            draw_star(w // 2, y_center, star_r)
            draw_star(w // 2 + spacing, y_center, star_r)
            return img

        flag_img = create_syrian_flag_icon(512)
        flag_img.save("app/src/main/res/drawable/app_logo.png", "PNG")

        sizes = {
            "mipmap-mdpi": 48,
            "mipmap-hdpi": 72,
            "mipmap-xhdpi": 96,
            "mipmap-xxhdpi": 144,
            "mipmap-xxxhdpi": 192
        }

        for folder, sz in sizes.items():
            icon = create_syrian_flag_icon(sz)
            icon.save(f"app/src/main/res/{folder}/ic_launcher.png", "PNG")
            icon.save(f"app/src/main/res/{folder}/ic_launcher_round.png", "PNG")

        print("Assets generated successfully!")
        '

    - name: Write Android Manifest, Layout and Java Files
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.VIBRATE" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:label="Auto Clicker"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".AutoClickService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

