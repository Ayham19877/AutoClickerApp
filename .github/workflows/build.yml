name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clean Workspace & Setup Project Files
      run: |
        rm -rf app settings.gradle build.gradle gradle.properties gradlew gradlew.bat gradle
        mkdir -p app/src/main/java/com/example/autoclicker
        mkdir -p app/src/main/res/xml

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AutoClickerApp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.autoclicker'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.autoclicker"
                minSdk 24
                targetSdk 33
                versionCode 2
                versionName "2.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="Auto Clicker"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.DeviceDefault">
                <service
                    android:name=".AutoClickService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeAllMask"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
            android:canRetrieveWindowContent="true"
            android:canPerformGestures="true"
            android:notificationTimeout="0" />
        EOF

        cat << 'EOF' > app/src/main/java/com/example/autoclicker/AutoClickService.java
        package com.example.autoclicker;

        import android.accessibilityservice.AccessibilityService;
        import android.accessibilityservice.GestureDescription;
        import android.graphics.Path;
        import android.graphics.Rect;
        import android.view.accessibility.AccessibilityEvent;
        import android.view.accessibility.AccessibilityNodeInfo;
        import java.util.List;

        public class AutoClickService extends AccessibilityService {

            private static final String TARGET_TEXT = "Accept";

            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
                AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                if (rootNode == null) return;

                scanAndClick(rootNode);
                rootNode.recycle();
            }

            private void scanAndClick(AccessibilityNodeInfo node) {
                if (node == null) return;

                CharSequence text = node.getText();
                CharSequence desc = node.getContentDescription();

                boolean matchText = text != null && text.toString().equalsIgnoreCase(TARGET_TEXT);
                boolean matchDesc = desc != null && desc.toString().equalsIgnoreCase(TARGET_TEXT);

                if (matchText || matchDesc) {
                    if (!node.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                        Rect rect = new Rect();
                        node.getBoundsInScreen(rect);
                        clickAt(rect.centerX(), rect.centerY());
                    }
                    return;
                }

                for (int i = 0; i < node.getChildCount(); i++) {
                    AccessibilityNodeInfo child = node.getChild(i);
                    if (child != null) {
                        scanAndClick(child);
                        child.recycle();
                    }
                }
            }

            private void clickAt(int x, int y) {
                Path path = new Path();
                path.moveTo(x, y);
                GestureDescription.Builder builder = new GestureDescription.Builder();
                GestureDescription gesture = builder.addStroke(new GestureDescription.StrokeDescription(path, 0, 1)).build();
                dispatchGesture(gesture, null, null);
            }

            @Override
            public void onInterrupt() {}
        }
        EOF

    - name: Setup & Build with Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoClicker-APK
        path: app/build/outputs/apk/debug/*.apk





