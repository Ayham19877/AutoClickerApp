        cat << 'EOF' > app/src/main/java/com/example/autoclicker/MainActivity.java
        package com.example.autoclicker;

        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.media.RingtoneManager;
        import android.net.Uri;
        import android.os.Bundle;
        import android.provider.Settings;
        import android.widget.Button;
        import android.widget.EditText;
        import android.widget.Toast;
        import androidx.annotation.Nullable;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.appcompat.widget.SwitchCompat;

        public class MainActivity extends AppCompatActivity {

            private static final int RINGTONE_PICKER_REQUEST = 999;
            private EditText etWords, etClickSpeed;
            private SwitchCompat switchEnable, switchClickAction, switchSound, switchNotification;
            private SharedPreferences prefs;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                etWords = findViewById(R.id.etWords);
                etClickSpeed = findViewById(R.id.etClickSpeed);
                switchEnable = findViewById(R.id.switchEnable);
                switchClickAction = findViewById(R.id.switchClickAction);
                switchSound = findViewById(R.id.switchSound);
                switchNotification = findViewById(R.id.switchNotification);

                Button btnSave = findViewById(R.id.btnSave);
                Button btnAccessibility = findViewById(R.id.btnAccessibility);
                Button btnSelectRingtone = findViewById(R.id.btnSelectRingtone);

                prefs = getSharedPreferences("AutoClickerPrefs", MODE_PRIVATE);

                etWords.setText(prefs.getString("words_list", "Accept, Confirm, Done"));
                etClickSpeed.setText(String.valueOf(prefs.getInt("click_speed_ms", 1)));
                switchEnable.setChecked(prefs.getBoolean("is_enabled", true));
                switchClickAction.setChecked(prefs.getBoolean("click_action_enabled", true));
                switchSound.setChecked(prefs.getBoolean("sound_enabled", true));
                switchNotification.setChecked(prefs.getBoolean("notification_enabled", true));

                switchEnable.setOnCheckedChangeListener((btn, isChecked) -> prefs.edit().putBoolean("is_enabled", isChecked).apply());
                switchClickAction.setOnCheckedChangeListener((btn, isChecked) -> prefs.edit().putBoolean("click_action_enabled", isChecked).apply());
                switchSound.setOnCheckedChangeListener((btn, isChecked) -> prefs.edit().putBoolean("sound_enabled", isChecked).apply());
                switchNotification.setOnCheckedChangeListener((btn, isChecked) -> prefs.edit().putBoolean("notification_enabled", isChecked).apply());

                btnSelectRingtone.setOnClickListener(v -> {
                    Intent intent = new Intent(RingtoneManager.ACTION_RINGTONE_PICKER);
                    intent.putExtra(RingtoneManager.EXTRA_RINGTONE_TYPE, RingtoneManager.TYPE_NOTIFICATION);
                    intent.putExtra(RingtoneManager.EXTRA_RINGTONE_TITLE, "اختر نغمة ظهور الكلمة");
                    String existingUri = prefs.getString("custom_sound_uri", null);
                    if (existingUri != null) {
                        intent.putExtra(RingtoneManager.EXTRA_RINGTONE_EXISTING_URI, Uri.parse(existingUri));
                    }
                    startActivityForResult(intent, RINGTONE_PICKER_REQUEST);
                });

                btnSave.setOnClickListener(v -> {
                    String words = etWords.getText().toString().trim();
                    String speedStr = etClickSpeed.getText().toString().trim();
                    int speed = 1;
                    try {
                        if (!speedStr.isEmpty()) speed = Integer.parseInt(speedStr);
                    } catch (Exception ignored) {}

                    if (!words.isEmpty()) {
                        prefs.edit()
                            .putString("words_list", words)
                            .putInt("click_speed_ms", speed)
                            .apply();
                        Toast.makeText(MainActivity.this, "تم حفظ الإعدادات بنجاح (برمجة الأيهم)", Toast.LENGTH_SHORT).show();
                    } else {
                        Toast.makeText(MainActivity.this, "الرجاء إدخال كلمة واحدة على الأقل", Toast.LENGTH_SHORT).show();
                    }
                });

                btnAccessibility.setOnClickListener(v -> {
                    Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                    startActivity(intent);
                });
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, @Nullable Intent data) {
                super.onActivityResult(requestCode, resultCode, data);
                if (requestCode == RINGTONE_PICKER_REQUEST && resultCode == RESULT_OK && data != null) {
                    Uri uri = data.getParcelableExtra(RingtoneManager.EXTRA_RINGTONE_PICKED_URI);
                    if (uri != null) {
                        prefs.edit().putString("custom_sound_uri", uri.toString()).apply();
                        Toast.makeText(this, "تم اختيار النغمة بنجاح!", Toast.LENGTH_SHORT).show();
                    }
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/autoclicker/AutoClickService.java
        package com.example.autoclicker;

        import android.accessibilityservice.AccessibilityService;
        import android.accessibilityservice.GestureDescription;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.content.Context;
        import android.content.SharedPreferences;
        import android.graphics.Path;
        import android.graphics.Rect;
        import android.media.Ringtone;
        import android.media.RingtoneManager;
        import android.net.Uri;
        import android.os.Build;
        import android.view.accessibility.AccessibilityEvent;
        import android.view.accessibility.AccessibilityNodeInfo;
        import androidx.core.app.NotificationCompat;
        import java.util.List;
        import java.util.concurrent.ExecutorService;
        import java.util.concurrent.Executors;

        public class AutoClickService extends AccessibilityService {

            private int currentStep = 0;
            private static final String CHANNEL_ID = "AutoClickerChannel";
            private final ExecutorService asyncExecutor = Executors.newSingleThreadExecutor();
            private long lastClickTime = 0;

            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
                long currentTime = System.currentTimeMillis();
                if (currentTime - lastClickTime < 20) return;

                CharSequence packageName = event.getPackageName();
                if (packageName != null && packageName.toString().equals("com.example.autoclicker")) {
                    return;
                }

                SharedPreferences prefs = getSharedPreferences("AutoClickerPrefs", MODE_PRIVATE);
                if (!prefs.getBoolean("is_enabled", true)) return;

                String rawWords = prefs.getString("words_list", "");
                if (rawWords.isEmpty()) return;

                String[] words = rawWords.split("[,،]");
                if (words.length == 0) return;

                if (currentStep >= words.length) currentStep = 0;
                String targetWord = words[currentStep].trim();
                if (targetWord.isEmpty()) return;

                AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                if (rootNode == null) return;

                List<AccessibilityNodeInfo> foundNodes = rootNode.findAccessibilityNodeInfosByText(targetWord);
                if (foundNodes != null && !foundNodes.isEmpty()) {
                    for (AccessibilityNodeInfo node : foundNodes) {
                        if (node != null && node.isVisibleToUser()) {
                            boolean clickActionEnabled = prefs.getBoolean("click_action_enabled", true);
                            int clickSpeed = prefs.getInt("click_speed_ms", 1);

                            // إذا كان تفعيل الكبس مفعل يتم النقر، وإلا يكتفي بالصوت والإشعار فقط
                            if (clickActionEnabled) {
                                executeFastClick(node, clickSpeed);
                            }

                            lastClickTime = System.currentTimeMillis();
                            currentStep++;
                            if (currentStep >= words.length) currentStep = 0;

                            final boolean soundOn = prefs.getBoolean("sound_enabled", true);
                            final boolean notifOn = prefs.getBoolean("notification_enabled", true);
                            final String soundUriStr = prefs.getString("custom_sound_uri", null);
                            final String wordMatched = targetWord;

                            asyncExecutor.execute(() -> {
                                if (soundOn) playCustomSound(soundUriStr);
                                if (notifOn) sendNotification(wordMatched, clickActionEnabled);
                            });
                            break;
                        }
                    }
                }
                rootNode.recycle();
            }

            private void executeFastClick(AccessibilityNodeInfo node, int durationMs) {
                if (!node.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                    if (node.getParent() != null && node.getParent().performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                        return;
                    }
                }
                Rect rect = new Rect();
                node.getBoundsInScreen(rect);
                clickAt(rect.centerX(), rect.centerY(), durationMs);
            }

            private void clickAt(int x, int y, int durationMs) {
                Path path = new Path();
                path.moveTo(x, y);
                GestureDescription.Builder builder = new GestureDescription.Builder();
                if (durationMs < 1) durationMs = 1;
                GestureDescription gesture = builder.addStroke(new GestureDescription.StrokeDescription(path, 0, durationMs)).build();
                dispatchGesture(gesture, null, null);
            }

            private void playCustomSound(String customUri) {
                try {
                    Uri notificationUri;
                    if (customUri != null && !customUri.isEmpty()) {
                        notificationUri = Uri.parse(customUri);
                    } else {
                        notificationUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                    }
                    Ringtone r = RingtoneManager.getRingtone(getApplicationContext(), notificationUri);
                    r.play();
                } catch (Exception e) {
                    e.printStackTrace();
                }
            }

            private void sendNotification(String word, boolean clicked) {
                NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Word Detect Alert", NotificationManager.IMPORTANCE_HIGH);
                    if (manager != null) manager.createNotificationChannel(channel);
                }

                String textMsg = clicked ? "تم الكشف والنقر على: " + word : "تم الكشف عن الكلمة (بدون كبس): " + word;

                NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setSmallIcon(android.R.drawable.stat_notify_chat)
                        .setContentTitle("برمجة الأيهم")
                        .setContentText(textMsg)
                        .setPriority(NotificationCompat.PRIORITY_HIGH)
                        .setAutoCancel(true);

                if (manager != null) {
                    manager.notify((int) System.currentTimeMillis(), builder.build());
                }
            }

            @Override
            public void onInterrupt() {}
        }
        EOF

    - name: Setup & Build with Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoClicker-APK
        path: app/build/outputs/apk/debug/*.apk
