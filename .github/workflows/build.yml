name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clean Workspace & Setup Project
      run: |
        rm -rf * .github/workflows/*
        mkdir -p .github/workflows
        mkdir -p app/src/main/java/com/example/autoclicker
        mkdir -p app/src/main/res/xml
        mkdir -p gradle/wrapper

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AutoClickerApp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.autoclicker'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.autoclicker"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="Auto Clicker"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.DeviceDefault">
                <service
                    android:name=".AutoClickService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canRetrieveWindowContent="true"
            android:notificationTimeout="10" />
        EOF

        cat << 'EOF' > app/src/main/java/com/example/autoclicker/AutoClickService.java
        package com.example.autoclicker;

        import android.accessibilityservice.AccessibilityService;
        import android.view.accessibility.AccessibilityEvent;
        import android.view.accessibility.AccessibilityNodeInfo;
        import java.util.List;

        public class AutoClickService extends AccessibilityService {

            private static final String TARGET_TEXT = "Accept";

            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
                if (event == null) return;
                AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                if (rootNode == null) return;

                List<AccessibilityNodeInfo> nodes = rootNode.findAccessibilityNodeInfosByText(TARGET_TEXT);
                if (nodes != null && !nodes.isEmpty()) {
                    for (AccessibilityNodeInfo node : nodes) {
                        if (node.getText() != null && node.getText().toString().toLowerCase().contains(TARGET_TEXT.toLowerCase())) {
                            if (!clickNodeOrParent(node)) {
                                node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                            }
                            break;
                        }
                    }
                }
            }

            private boolean clickNodeOrParent(AccessibilityNodeInfo node) {
                AccessibilityNodeInfo current = node;
                while (current != null) {
                    if (current.isClickable()) {
                        return current.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                    }
                    current = current.getParent();
                }
                return false;
            }

            @Override
            public void onInterrupt() {}
        }
        EOF

        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoClicker-APK
        path: app/build/outputs/apk/debug/*.apk






