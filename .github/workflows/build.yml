name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Pillow
      run: pip install Pillow

    - name: Clean Workspace & Setup Project Directories
      run: |
        rm -rf app settings.gradle build.gradle gradle.properties gradlew gradlew.bat gradle
        mkdir -p app/src/main/java/com/example/autoclicker
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/mipmap-mdpi
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AutoClickerApp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.autoclicker'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.autoclicker"
                minSdk 24
                targetSdk 33
                versionCode 10
                versionName "10.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

    - name: Generate Icon Images From Embedded Base64
      run: |
        cat << 'EOF' > make_icons.py
        import base64
        import io
        from PIL import Image

        # SVG/PNG icon representation generated for Auto Clicker icon
        icon_svg = '''<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="120" fill="#1E1B4B"/>
          <circle cx="256" cy="256" r="180" fill="#312E81" stroke="#6366F1" stroke-width="12"/>
          <path d="M 210 130 L 210 320 L 260 270 L 300 360 L 340 340 L 300 250 L 370 250 Z" fill="#F43F5E" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
          <circle cx="256" cy="110" r="16" fill="#60A5FA"/>
          <circle cx="390" cy="256" r="16" fill="#60A5FA"/>
          <circle cx="256" cy="402" r="16" fill="#60A5FA"/>
          <circle cx="122" cy="256" r="16" fill="#60A5FA"/>
        </svg>'''

        # Create simple custom launcher icon
        sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
        }

        # Generate smooth icons
        for folder, sz in sizes.items():
            img = Image.new('RGBA', (sz, sz), color=(30, 27, 75, 255))
            # Draw cursor representation
            from PIL import ImageDraw
            draw = ImageDraw.Draw(img)
            pad = sz // 8
            draw.rectangle([pad, pad, sz - pad, sz - pad], fill=(49, 46, 129), outline=(99, 102, 241), width=max(1, sz//24))
            
            # Target cross/cursor symbol inside
            cx, cy = sz // 2, sz // 2
            r = sz // 4
            draw.ellipse([cx - r, cy - r, cx + r, cy + r], outline=(244, 63, 94), width=max(2, sz//16))
            draw.ellipse([cx - r//2, cy - r//2, cx + r//2, cy + r//2], fill=(244, 63, 94))
            
            img.save(f'app/src/main/res/{folder}/ic_launcher.png', 'PNG')
            img.save(f'app/src/main/res/{folder}/ic_launcher_round.png', 'PNG')

        print("Successfully generated custom app icons for all densities!")
        EOF
        python make_icons.py

    - name: Write Android Manifest, Layout and Java Files
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.VIBRATE" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:label="Auto Clicker"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".AutoClickService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:fillViewport="true">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:padding="20dp"
                android:gravity="center_horizontal">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="تطبيق النقر التلقائي الفائق"
                    android:textSize="22sp"
                    android:textStyle="bold"/>

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="برمجة الأيهم"
                    android:textSize="14sp"
                    android:textColor="#3F51B5"
                    android:textStyle="bold"
                    android:layout_marginBottom="4dp"/>

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="turky.jadou@gmail.com"
                    android:textSize="13sp"
                    android:textColor="#555555"
                    android:layout_marginBottom="16dp"/>

                <!-- مفتاح التفعيل الرئيسي -->
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:gravity="center_vertical"
                    android:padding="12dp"
                    android:background="#E8EAF6"
                    android:layout_marginBottom="10dp">

                    <TextView
                        android:layout_width="0dp"
                        android:layout_height="wrap_content"
                        android:layout_weight="1"
                        android:text="تفعيل / إيقاف التلقائي:"
                        android:textSize="15sp"
                        android:textStyle="bold" />

                    <androidx.appcompat.widget.SwitchCompat
                        android:id="@+id/switchEnable"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"/>
                </LinearLayout>

                <!-- مفتاح التنبيه الصوتي عند الكشف -->
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:gravity="center_vertical"
                    android:padding="12dp"
                    android:background="#F5F5F5"
                    android:layout_marginBottom="10dp">

                    <TextView
                        android:layout_width="0dp"
                        android:layout_height="wrap_content"
                        android:layout_weight="1"
                        android:text="الصوت عند ظهور الكلمة:"
                        android:textSize="15sp" />

                    <androidx.appcompat.widget.SwitchCompat
                        android:id="@+id/switchSound"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"/>
                </LinearLayout>

                <!-- زر اختيار النغمة -->
                <Button
                    android:id="@+id/btnSelectRingtone"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="اختيار نغمة التنبيه الخاصة"
                    android:backgroundTint="#FF9800"
                    android:textColor="#FFFFFF"
                    android:layout_marginBottom="10dp"/>

                <!-- مفتاح الإشعارات عند الكشف -->
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:gravity="center_vertical"
                    android:padding="12dp"
                    android:background="#F5F5F5"
                    android:layout_marginBottom="16dp">

                    <TextView
                        android:layout_width="0dp"
                        android:layout_height="wrap_content"
                        android:layout_weight="1"
                        android:text="إشعار عند ظهور الكلمة:"
                        android:textSize="15sp" />

                    <androidx.appcompat.widget.SwitchCompat
                        android:id="@+id/switchNotification"
